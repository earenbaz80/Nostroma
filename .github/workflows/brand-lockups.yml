name: Brand lockups

# Checks that the lockups in apps/host/public/brand still match what
# apps/host/scripts/prepare-brand-lockups.py draws from the face in
# apps/host/public/fonts, and that each committed PNG still shows the SVG it
# sits next to. It needs no write access.

on:
  pull_request:
    paths:
      - 'apps/host/scripts/prepare-brand-lockups.py'
      - 'apps/host/scripts/brand-png-check.mjs'
      - 'apps/host/scripts/browser.mjs'
      - 'apps/host/public/brand/**'
      - 'apps/host/public/fonts/**'
      - '.github/workflows/brand-lockups.yml'
  push:
    branches: [main]
    paths:
      - 'apps/host/scripts/prepare-brand-lockups.py'
      - 'apps/host/scripts/brand-png-check.mjs'
      - 'apps/host/scripts/browser.mjs'
      - 'apps/host/public/brand/**'
      - 'apps/host/public/fonts/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # fontTools is pinned to the release named as DRAWN_WITH in the script:
      # the way it formats path numbers can change between releases, and a
      # newer one would fail the comparison for a reason that is not an edit.
      - name: Install the drawing tools
        run: python3 -m pip install --disable-pip-version-check fonttools==4.68.0 brotli
      - name: Check the lockups
        run: python3 apps/host/scripts/prepare-brand-lockups.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/host/package-lock.json
      # The browser build is tied to the Playwright release, so the version from
      # the lockfile is the cache key: a new playwright-core misses it once and
      # downloads again, everything else restores the ~260 MB build in seconds.
      - name: Find the Playwright version
        id: playwright
        working-directory: apps/host
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "playwright-core $version"

      - name: Restore the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The headless shell is the smaller Chromium build and is all a
      # screenshot needs. It lands in the Playwright cache, which
      # scripts/browser.mjs reads, so no path has to be pinned here. With the
      # cache restored this step only checks what is already there.
      - name: Install the browser
        working-directory: apps/host
        run: |
          npm ci
          npx playwright-core install --with-deps --only-shell chromium
      - name: Compare each SVG with its PNG
        working-directory: apps/host
        run: npm run brand:png-vs-svg
