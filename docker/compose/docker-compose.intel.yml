# Nostroma on an Intel Arc card (A-series or B-series, including Arc Pro B70). Needs the xe or i915 kernel driver on the host.
# The Level Zero loader and Intel's compute runtime are in the image (Ubuntu 26.04 based).
#
#   cp .env.example .env
#   docker compose -f docker-compose.intel.yml up -d
#
# Images: ghcr.io/earenbaz80/Nostroma (published from 0.2.1 on). To use one you built yourself: NOSTROMA_IMAGE=nostroma:0.2.7-<flavor> docker compose up -d
services:
  nostroma:
    image: ${NOSTROMA_IMAGE:-ghcr.io/earenbaz80/Nostroma:0.2.7-sycl}
    container_name: nostroma
    restart: unless-stopped
    ports:
      - "${NOSTROMA_BIND:-127.0.0.1}:${NOSTROMA_PORT:-8080}:8080"
    environment:
      MODEL: ${MODEL:-}
      MODEL_PATH: ${MODEL_PATH:-}            # GGUF files you already have, as seen inside the container (mount them below)
      CONTEXT: ${CONTEXT:-32k}
      PARALLEL: ${PARALLEL:-}
      VISION: ${VISION:-off}
      TUNE: ${TUNE:-skip}
      API_KEY: ${API_KEY:-}
    volumes:
      - nostroma-data:/data
      # - /srv/gguf/IQ3_XXS:/models:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-render}"              # the host's render group id: getent group render | cut -d: -f3 (needed: the image runs as an
                                             # unprivileged account, which does not open /dev/dri without it; 109 is the usual number)
    ulimits:
      memlock: { soft: -1, hard: -1 }
    shm_size: 2gb
    stop_grace_period: 2m
volumes:
  nostroma-data:
