# Nostroma on an AMD card. gfx120X image: RX 9000 series and Radeon AI PRO R9700 (RDNA4). gfx110X image: RX 7000 series (RDNA3).
# Needs the amdgpu kernel driver on the host (the ROCm user-space is in the image).
#
#   cp .env.example .env
#   docker compose -f docker-compose.amd.yml up -d
#
# Images: ghcr.io/earenbaz80/Nostroma (published from 0.2.1 on). To use one you built yourself: NOSTROMA_IMAGE=nostroma:0.2.7-<flavor> docker compose up -d
services:
  nostroma:
    image: ${NOSTROMA_IMAGE:-ghcr.io/earenbaz80/Nostroma:0.2.7-rocm-gfx120x}
    container_name: nostroma
    restart: unless-stopped
    ports:
      - "${NOSTROMA_BIND:-127.0.0.1}:${NOSTROMA_PORT:-8080}:8080"
    environment:
      MODEL: ${MODEL:-}
      MODEL_PATH: ${MODEL_PATH:-}            # GGUF files you already have, as seen inside the container (mount them below)
      CONTEXT: ${CONTEXT:-32k}
      PARALLEL: ${PARALLEL:-}
      VISION: ${VISION:-off}
      TUNE: ${TUNE:-skip}
      API_KEY: ${API_KEY:-}
    volumes:
      - nostroma-data:/data
      # - /srv/gguf/IQ3_XXS:/models:ro
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video                                # needed: the image runs as an unprivileged account, which does not open /dev/kfd without it
      - "${RENDER_GID:-render}"              # the host's render group id: getent group render | cut -d: -f3 (the image has both groups;
                                             # set RENDER_GID when your number is not 109, or use --group-add with the number)
    ulimits:
      memlock: { soft: -1, hard: -1 }
    shm_size: 2gb
    stop_grace_period: 2m
    # security_opt: [seccomp:unconfined]     # only if the log says a ROCm call was blocked (rare)
volumes:
  nostroma-data:
