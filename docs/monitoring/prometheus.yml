# Scrape a Nostroma server's GET /metrics (Prometheus text, vLLM's names; docs/DETAILS.md).
# Prometheus asks for text/plain, so it gets the text format; the Monitor tab keeps the JSON.
scrape_configs:
  - job_name: nostroma
    metrics_path: /metrics
    scrape_interval: 15s
    # with an API key (nostroma-<model>.json "api_key" or --api-key): sent as a bearer token
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/nostroma-api-key
    static_configs:
      - targets: ["127.0.0.1:8080"]
